name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            parallel: 2
          - os: ubuntu-24.04-arm
            parallel: 2
          - os: macos-latest
            parallel: 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Hosted runners are slower and noisier than a workstation, so the
      # tests' timing bounds are doubled. The tests whose bound is the
      # point skip at a scale above 1.
      PGMEM_TIME_SCALE: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        # Each test binary that starts a server needs a few hundred MiB.
        # The Linux runners run two at a time, and the macOS runner, with
        # less memory, one.
        run: go test -p ${{ matrix.parallel }} -timeout 45m ./...
